<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University | Trainer Registration</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@100..900&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

    <!-- Header -->

    <section class="sub-header">

        <nav>

            <a href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='images/small-logo-png.png') }}" alt="Logo">
            </a>

            <div class="nav-links" id="navLinks">

                <i class="fa-solid fa-xmark" onclick="hideMenu()"></i>

                <ul>
                    <li><a href="{{ url_for('index') }}">HOME</a></li>
                    <li><a href="{{ url_for('about') }}">ABOUT</a></li>
                    <li><a href="{{ url_for('course') }}">COURSE</a></li>
                    <li><a href="{{ url_for('blog') }}">BLOG</a></li>
                    <li><a href="{{ url_for('contact') }}">CONTACT</a></li>
                    <li><a href="{{ url_for('trainer') }}">TRAINER</a></li>
                </ul>

            </div>

            <i class="fa-solid fa-bars" onclick="showMenu()"></i>

        </nav>

        <h1>Student Registration</h1>

    </section>

    <!-- Registration Form -->

    <section class="contact-us">

        <div class="row">

            <div class="contact-col">

                <h2 style="margin-bottom:25px;">Training Registration Form</h2>

                <form action="{{ url_for('register') }}" method="POST">

                    <input
                        type="number"
                        name="id"
                        placeholder="Student ID"
                        required>

                    <input
                        type="text"
                        name="fullname"
                        placeholder="Full Name"
                        required>

                    <input
                        type="text"
                        name="training"
                        placeholder="Training Name"
                        required>

                    <input
                        type="text"
                        name="trainer"
                        placeholder="Trainer Name"
                        required>

                    <input
                        type="text"
                        name="batch"
                        placeholder="Batch"
                        required>

                    <button
                        type="submit"
                        class="hero-btn red-btn">
                        Register Now
                    </button>

                </form>

            </div>

            <div class="contact-col">

                <img src="{{ url_for('static', filename='images/about.jpg') }}"
                    alt="Training"
                    style="width:100%; border-radius:10px;">

            </div>

        </div>

    </section>

    <!-- Footer -->

    <section class="footer">

        <h4>About Us</h4>

        <p>
            SVVV provides quality education, industry-oriented training,
            modern infrastructure, and experienced faculty to help students
            build successful careers.
        </p>

        <div class="icons">

            <a href="#"><i class="fa-brands fa-facebook"></i></a>
            <a href="#"><i class="fa-brands fa-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-linkedin"></i></a>

        </div>

        <p>
            Made with <i class="fa-regular fa-heart"></i> by Abhishek
        </p>

    </section>

    <script>

        var navLinks = document.getElementById("navLinks");

        function showMenu() {
            navLinks.style.right = "0";
        }

        function hideMenu() {
            navLinks.style.right = "-200px";
        }

    </script>

</body>

</html>
